skill:
  id: "damages-quantum-modeling"
  name: "Damages Quantum Modeling & Restitution Accounting"
  version: "1.1.0"

  policy:
    valuation_status_default: "TBD (valuation pending)"
    publication_rule: "No published pool without versioned cited workbook and human review"
    verification_rule: "NO_VERIFIED_WITHOUT_LOCAL_HASHED_ARTIFACT"
    vector_baseline: "1805 vectors minimum baseline and goal; expand with verified evidence"

  capabilities:
    - "Model historical valuations from primary records (cadastral, contracts, certified claims, ledgers)"
