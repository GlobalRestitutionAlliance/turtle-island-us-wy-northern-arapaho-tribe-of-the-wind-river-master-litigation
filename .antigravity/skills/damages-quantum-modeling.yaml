    - "Produce low/base/high bands with confidence and offsets"
    - "Link every valuation row to vector, citation, hashed artifact, and reviewer"

  output_requirements:
    - "No fabricated amounts, sources, or citations"
    - "All amounts traceable to workbook rows and local hashed artifacts"
    - "Default status PENDING_LEGAL_REVIEW until human sign-off"
