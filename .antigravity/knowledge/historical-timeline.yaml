historical_timeline:
  title: Chronological Continuum of U.S. Interventions & Invasions in Nicaragua (1854–2026)
  epochs:
  - period: "1854"
    event: "Bombardment and Burning of San Juan del Norte (Greytown) by USS Cyane"
    significance: "Unprovoked naval destruction of sovereign commercial free port to establish transit hegemony."
  - period: "1855–1857"
    event: "William Walker Mercenary Filibuster War & Re-imposition of Slavery"
    significance: "Tennessee mercenary usurps presidency, re-legalizes slavery, receives Franklin Pierce diplomatic recognition, and seizes Vanderbilt transit lines."
  - period: "1909"
    event: "Knox Note & Coercive Overthrow of President José Santos Zelaya"
    significance: "U.S. severs relations and forces resignation of nationalist leader resisting U.S. financial and canal monopoly."
  - period: "1910–1911"
    event: "Dawson Agreements & Imposition of U.S. Customs Receivership"
    significance: "U.S. takes direct control of customs houses and establishes Wall Street banking control (Brown Brothers / Seligman)."
  - period: "1912–1933"
    event: "U.S. Marine Armed Occupations & Battle of Coyotepe Hill"
    significance: "Two decades of military occupation, suppression of Benjamín Zeledón, war against Augusto C. Sandino, and creation of Somoza's Guardia Nacional."
  - period: "1914–1916"
    event: "Bryan-Chamorro Treaty & Central American Court of Justice Rulings"
    significance: "U.S. purchases perpetual canal concession for $3M; CACJ rules treaty illegal; U.S. defies court."
  - period: "1981–1990"
    event: "Contra Paramilitary War, Port Mining & Covert CIA Operations"
    significance: "Reagan executive orders arm Contras, mine Corinto/Puerto Sandino, destroy fuel reserves, and impose total trade embargo."
  - period: "1984–1986"
    event: "International Court of Justice (ICJ) Litigation & Merits Judgment"
    significance: "World Court rules U.S. violated customary international law not to use force; commands full reparation."
  - period: "1986–2026"
    event: "UN Charter Article 94 Default & Transnational Restitution Era"
    significance: "U.S. vetoes UN Security Council enforcement; UN General Assembly votes repeatedly for compliance; damages compound to $250.00B+."
