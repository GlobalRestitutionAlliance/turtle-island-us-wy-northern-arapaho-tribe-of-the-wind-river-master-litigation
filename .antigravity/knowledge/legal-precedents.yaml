legal_precedents:
  title: Master Jurisprudential Precedents & Controlling Authorities (Nicaragua Restitution)
  international_adjudications:
  - case: Military and Paramilitary Activities in and against Nicaragua (Nicaragua v. United States of America), Merits, 1986 I.C.J. Rep. 14
    holding: United States breached customary international law not to use force, of non-intervention, and territorial sovereignty; ordered to make full reparation.
  - case: Factory at Chorzów (Claim for Indemnity) (Merits), 1928 P.C.I.J. (ser. A) No. 17
    holding: Breach of an international engagement involves an obligation to make reparation in an adequate form; restitution in integrum principle.
  - case: Costa Rica v. Nicaragua, Central American Court of Justice (Judgment of Sept. 30, 1916)
    holding: 1914 Bryan-Chamorro Treaty breached Cañas-Jerez Treaty of 1858 and violated Central American international law.
  - case: El Salvador v. Nicaragua, Central American Court of Justice (Judgment of March 9, 1917)
    holding: Bryan-Chamorro Treaty concession in Gulf of Fonseca violated co-sovereignty rights of riparian states.
  fiduciary_trust_and_state_responsibility:
  - case: United States v. Mitchell, 463 U.S. 206 (1983)
    holding: Sovereign assumes fiduciary trust duties when exercising comprehensive administrative control over foreign or indigenous territory/property.
  - case: United States v. White Mountain Apache Tribe, 537 U.S. 465 (2003)
    holding: Actual physical custody and managerial dominion creates enforceable common-law trustee accountability.
  - case: Cobell v. Salazar, 573 F.3d 808 (D.C. Cir. 2009)
    holding: Statute of limitations does not run against trust beneficiaries seeking accounting while trust remains un-repudiated.
  sovereign_immunity_exceptions:
  - case: First National City Bank v. Banco Para El Comercio Exterior de Cuba (Bancec), 462 U.S. 611 (1983)
    holding: Separate juridical personality of sovereign instrumentalities is disregarded where extensive control exists or to avoid fraud/injustice.
  - case: Perrin v. United States, French-American Claims Commission (1868)
    holding: Adjudicating property destruction from 1854 Greytown naval bombardment.
