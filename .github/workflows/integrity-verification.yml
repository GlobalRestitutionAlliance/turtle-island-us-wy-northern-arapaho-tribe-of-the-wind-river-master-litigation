name: Evidentiary Integrity Verification
on:
  push:
  pull_request:
jobs:
  verify-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SHA-256 Manifest
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f VERIFICATION_KEYS/sha256_manifest.txt ]; then sha256sum -c VERIFICATION_KEYS/sha256_manifest.txt; else echo No manifest && exit 1; fi
